<section class="skills-section" id="skills">

    <div class="container">

        <div class="section-title">

            <h2>Technical Skills</h2>

            <p>
                Technologies and tools I use to build scalable,
                maintainable and high-performance Angular applications.
            </p>

        </div>

        <div class="row g-4">

            @for(category of skills; track category.title){

                <div class="col-lg-4">

                    <div class="skill-card">

                        <div class="skill-header">

                            <span class="skill-icon">
                                {{category.icon}}
                            </span>

                            <h3>
                                {{category.title}}
                            </h3>

                        </div>

                        <div class="skill-list">

                            @for(item of category.items; track item){

                                <span class="skill-chip">

                                    {{item}}

                                </span>

                            }

                        </div>

                    </div>

                </div>

            }

        </div>

    </div>

</section>
