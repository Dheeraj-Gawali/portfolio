<section class="contact-section" id="contact">

    <div class="container">

        <div class="section-title">

            <h2>Let's Connect</h2>

            <p class="subtitle">
                I'm actively seeking Angular Developer opportunities.
                Whether you have a role, project, or collaboration in mind,
                I'd be happy to connect.
            </p>

        </div>

        <div class="row g-4">

            <div class="col-md-4">

                <div class="contact-card">

                    <div class="icon">📧</div>

                    <h5>Email</h5>

                    <a [href]="'mailto:' + contact.email">

                        {{contact.email}}

                    </a>

                </div>

            </div>

            <div class="col-md-4">

                <div class="contact-card">

                    <div class="icon">📱</div>

                    <h5>Phone</h5>

                    <a [href]="'tel:' + contact.phone">

                        {{contact.phone}}

                    </a>

                </div>

            </div>

            <div class="col-md-4">

                <div class="contact-card">

                    <div class="icon">📍</div>

                    <h5>Location</h5>

                    <p>

                        {{contact.location}}

                    </p>

                </div>

            </div>

        </div>

        <div class="resume-section mt-5">

            <button
                class="btn btn-primary btn-lg"
                (click)="downloadResume($event)">

                📄 Download Resume

            </button>

        </div>

        <div class="social-links mt-5">

            <a
                [href]="contact.linkedin"
                target="_blank"
                class="btn btn-outline-light">

                LinkedIn

            </a>

            <a
                [href]="contact.github"
                target="_blank"
                class="btn btn-outline-light ms-3">

                GitHub

            </a>

        </div>

    </div>

</section>
