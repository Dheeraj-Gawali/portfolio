<section class="about-section" id="about">
    <div class="container">

        <!-- Heading -->

        <div class="section-title">
            <h2>About Me</h2>
            <p>
                Senior Angular Developer with 6+ years of experience
                building scalable web applications.
            </p>
        </div>

        <!-- Profile -->

        <div class="about-card">
            <p>
                {{profile.summary}}
            </p>
        </div>

        <!-- Highlights -->

        <div class="row highlights">
            <div class="col-md-4">
                <div class="highlight-card">
                    <h3>6+</h3>
                    <p>
                        Years Experience
                    </p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="highlight-card">
                    <h3>Angular</h3>
                    <p>
                        Frontend Expertise
                    </p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="highlight-card">
                    <h3>Enterprise</h3>
                    <p>
                        Application Development
                    </p>
                </div>
            </div>
        </div>

        <!-- Skills -->

        <div class="skills-section">
            <h3>
                Technical Skills
            </h3>
            <div class="skills-container">
                <span
                *ngFor="let skill of skills">
                    {{skill}}
                </span>
            </div>
        </div>
    </div>
</section>
